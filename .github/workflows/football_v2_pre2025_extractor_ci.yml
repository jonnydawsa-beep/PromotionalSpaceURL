name: Football V2 Pre-2025 Extractor CI

on:
  push:
    branches:
      - football-v2-pre2025-extractor-v1
    paths:
      - 'FOOTBALL_V2_0_PRE2025_SQLITE_EXTRACTOR/**'
      - '.github/workflows/football_v2_pre2025_extractor_ci.yml'
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python files
        shell: pwsh
        run: |
          python -m py_compile `
            FOOTBALL_V2_0_PRE2025_SQLITE_EXTRACTOR/extract_research.py `
            FOOTBALL_V2_0_PRE2025_SQLITE_EXTRACTOR/doctor.py `
            FOOTBALL_V2_0_PRE2025_SQLITE_EXTRACTOR/pack_for_upload.py

      - name: Run synthetic end-to-end extraction test
        shell: pwsh
        run: |
          python FOOTBALL_V2_0_PRE2025_SQLITE_EXTRACTOR/extract_research.py --self-test

      - name: Check holdout firewall source structure
        shell: pwsh
        run: |
          $text = Get-Content FOOTBALL_V2_0_PRE2025_SQLITE_EXTRACTOR/extract_research.py -Raw
          if ($text -match 'glob\(' -or $text -match 'iterdir\(' -or $text -match 'listdir\(') {
            throw 'Extractor must not glob/list the source directory.'
          }
          if ($text -notmatch 'RESEARCH_YEARS\s*=\s*tuple\(range\(2015,\s*2025\)\)') {
            throw 'Research-year firewall declaration missing or changed.'
          }
          if ($text -notmatch 'source_paths\s*=\s*\{year:\s*raw_dir\s*/\s*f"\{year\}\.tar"\s*for\s*year\s*in\s*RESEARCH_YEARS\}') {
            throw 'Explicit research-source construction missing or changed.'
          }
          Write-Host 'HOLDOUT FIREWALL STATIC CHECK PASS'

      - name: Write tested build information
        shell: pwsh
        run: |
          @"
          BUILD=FOOTBALL_V2_0_PRE2025_SQLITE_EXTRACTOR_v1.0.0
          COMMIT=${{ github.sha }}
          WINDOWS_CI=PASS
          SYNTHETIC_END_TO_END=PASS
          HOLDOUT_FIREWALL_STATIC_CHECK=PASS
          "@ | Set-Content FOOTBALL_V2_0_PRE2025_SQLITE_EXTRACTOR/BUILD_INFO.txt

      - name: Upload tested unpack-ready package
        uses: actions/upload-artifact@v4
        with:
          name: FOOTBALL_V2_0_PRE2025_SQLITE_EXTRACTOR_v1_0_0
          path: FOOTBALL_V2_0_PRE2025_SQLITE_EXTRACTOR/
          if-no-files-found: error
          retention-days: 30
